name: Generate Custom Resume

on:
  repository_dispatch:
    types: [update-resume]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master resume
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Create custom DOCX
        env:
          SKILLS: ${{ github.event.client_payload.skills }}
        run: python update_resume.py

      - name: Convert DOCX to PDF
        run: |
          libreoffice \
            --headless \
            --convert-to pdf \
            --outdir . \
            custom-resume.docx

      - name: Send PDF to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: python send_pdf.py
